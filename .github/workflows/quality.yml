name: Repository quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:certification-quality
      - run: node scripts/audit-certification-purpose.mjs
      - run: node scripts/audit-certification-workshop.mjs
      - run: node scripts/audit-certification-simple.mjs
      - run: node scripts/audit-certification-quality-pass.mjs
      - run: node scripts/audit-certification-new-paths.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
