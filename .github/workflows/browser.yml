name: Browser regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Desktop and mobile browsers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run all engineering and study journeys
        run: npm run test:browser:ci
      - name: Cross-browser recruiter journeys
        run: npm run test:recruiter-browser
      - name: Keep browser results and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.run_attempt }}
          path: |
            artifacts/browser-ci/
            test-results/browser-ci/
            artifacts/recruiter-review/
            test-results/recruiter-review/
          retention-days: 7
